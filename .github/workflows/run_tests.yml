name: Run tests
on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Выберите цель деплоя/теста'
        required: true
        default: 'first_test'
        type: choice
        options:
          - first_test
          - second_test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обновлено до v4

      - name: Setup Python
        uses: actions/setup-python@v5 # Обновлено до v5
        with:
          python-version: "3.10"

      - name: Install Chrome
        run: sudo apt-get install google-chrome-stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: first_test
        if: github.event.inputs.deployment_target == 'first_test'
        run: pytest test_button.py::test_button_exist --alluredir=allure-results

      - name: second_test
        if: github.event.inputs.deployment_target == 'second_test'
        run: pytest test_button.py::test_button_exist_2 --alluredir=allure-results

      - name: Store allure-results
        uses: actions/upload-artifact@v4 # ИСПРАВЛЕНО: v3 заменено на v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v4 # Обновлено до v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - run: sudo wget https://github.com && sudo tar -zxvf allure-2.24.1.tgz -C /opt/ && sudo ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4 # ИСПРАВЛЕНО: v3 заменено на v4
        with:
          name: allure-results # Рекомендуется явно указывать имя скачиваемого артефакта

      - run: allure generate -c allure-results -o _site

      - name: Store generated report
        uses: actions/upload-artifact@v4 # ИСПРАВЛЕНО: v3 заменено на v4
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4 # ИСПРАВЛЕНО: v3 заменено на v4
        with:
          name: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3 # ИСПРАВЛЕНО: убрана опечатка в слове 'artifact' и обновлено до v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Обновлено до v4
